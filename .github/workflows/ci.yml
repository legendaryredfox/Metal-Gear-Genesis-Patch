name: CI

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:

jobs:
  build:
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v4

      # No ROMs in CI: the tests that need real dumps are skipped (see README).
      - name: Unit and UI tests
        run: ./gradlew :app:desktopTest

      - name: Single jar for this system
        run: ./gradlew :app:packageUberJarForCurrentOS

      # .deb on Linux, .dmg on macOS, .msi on Windows (jpackage only builds for its own system)
      - name: Native installer for this system
        run: ./gradlew :app:packageDistributionForCurrentOS

      - uses: actions/upload-artifact@v4
        with:
          name: MetalGearPatcher-${{ matrix.os }}
          path: |
            app/build/compose/jars/*.jar
            app/build/compose/binaries/main/deb/*.deb
            app/build/compose/binaries/main/dmg/*.dmg
            app/build/compose/binaries/main/msi/*.msi
          if-no-files-found: error

  # On a version tag, collect the three systems' files and publish them as a GitHub release.
  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Checksums
        run: cd dist && sha256sum * > SHA256SUMS.txt && cat SHA256SUMS.txt
      - uses: softprops/action-gh-release@v2
        with:
          name: Metal Gear Genesis Patcher ${{ github.ref_name }}
          body_path: .github/release-notes-1.0.0.md
          files: dist/*
